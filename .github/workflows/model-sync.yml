name: Model sync

# Weekly: diff src/core/models.json against the public OpenRouter model list
# and open (or update) one review PR. Nothing ships until a person merges it.
# No provider key exists or is needed; the only outbound request is one GET
# of the public list. See documentation/cron.md and DECISIONS.md D34.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: model-sync
  cancel-in-progress: false

env:
  BRANCH: chore/model-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Diff the registry against the public model list
        run: node scripts/sync-models.ts --write --report "$RUNNER_TEMP/model-sync.md"

      # Always visible on the run page, so a reported-only difference (an
      # official price the list disagrees with) is never silent.
      - name: Show the report in the run summary
        run: cat "$RUNNER_TEMP/model-sync.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Stop when nothing changed
        id: diff
        run: |
          if git diff --quiet -- src/core/models.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Registry already matches the public list."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A sync PR from an earlier run proposes changes this run no longer
      # would, so it is closed rather than left to be merged by mistake.
      - name: Close an out-of-date sync PR
        if: steps.diff.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open_pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open_pr" ]; then
            gh pr close "$open_pr" --delete-branch --comment "Closed by the $(date -u +%F) sync: the registry now matches what it would propose. See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID for the report."
          fi

      # A PR opened with GITHUB_TOKEN does not trigger ci.yml, so the same
      # gate runs here and its outcome goes into the PR body.
      - name: Run the required checks on the proposed registry
        id: check
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: npm run check

      - name: Open or update the review PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          body="$RUNNER_TEMP/pr-body.md"
          if [ "$CHECK_OUTCOME" = "success" ]; then
            echo "**Checks:** \`npm run check\` passed on this branch (lint, tests, build, bundle guard)." > "$body"
          else
            echo "**Checks:** \`npm run check\` FAILED on this branch. See the workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$body"
          fi
          echo "" >> "$body"
          cat "$RUNNER_TEMP/model-sync.md" >> "$body"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add src/core/models.json
          git commit -m "Model sync: $(date -u +%F)"
          git push --force origin "$BRANCH"

          open_pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --title "Model sync: $(date -u +%F)" --body-file "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "Model sync: $(date -u +%F)" --body-file "$body"
          fi
